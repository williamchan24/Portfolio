# Builds the site and uploads it to the FTP server on every push to main.
# FTP settings come from the repo's Actions secrets (Settings → Secrets and variables → Actions).
name: Deploy to FTP

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run a deploy by hand from the Actions tab

# Never run two deploys at once — the second waits for the first to finish.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Upload dist/ to FTP
        run: node scripts/deploy.mjs
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: /www
          FTP_ALLOW_SELF_SIGNED: 'true'
